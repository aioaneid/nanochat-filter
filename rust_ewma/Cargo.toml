[package]
name = "rust_ewma"
version = "0.1.1"
edition = "2024"

[features]
python = ["dep:pyo3", "dep:numpy"]
metal = ["dep:metal", "dep:objc"]
cuda = []

[lib]
crate-type = [
    "cdylib",
    # "rlib",
]

[dependencies]
numpy = { version = "0.27.1", optional = true }
ndarray = { version = "0.17.1", features = ["approx", "blas"] }
pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }
num-traits = "0.2"
itertools = "0.14.0"
rand = { version = "0.8", features = ["small_rng"] }
anyhow = "1.0.100"
approx = "0.5.1"
log = { version = "0.4.29", features = ["release_max_level_info"] }
env_logger = "0.11.8"
serde = "1.0.228"
bytes = "1.0"
bytemuck = "1.24.0"
arrayvec = "0.7.6"
num-integer = "0.1.46"
parameterized = "2.1.0"
once_cell = "1.21.3"
metal = { version="0.33.0", optional = true }
objc = {version = "0.2.7", optional = true }
pyo3-log = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(target_os = "linux")'.dependencies]

[build-dependencies]
cc = "1.2.53"
